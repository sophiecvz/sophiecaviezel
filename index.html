<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="a little space beyond the feed — Sophie Caviezel" />
    <title>Sophie Caviezel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="profile">
      <header class="profile__hero">
        <img class="profile__portrait" src="/images/portrait.webp" alt="Sophie Caviezel" />

        <div class="profile__identity">
          <h1 class="profile__title">Sophie Caviezel</h1>
          <p class="profile__username">@sophiecaviezel</p>
        </div>
      </header>

      <div class="profile__content">
        <div class="profile__access">
          <a class="profile__link profile__link--telegram" href="https://t.me/+TwVGQYl1WiM0ZDBi">
            <span class="profile__link-heading">
              <img
                class="profile__link-icon"
                src="/images/icon-telegram.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="profile__link-label">see more of me</span>
            </span>
            <span class="profile__link-description">Telegram · photos &amp; moments</span>
          </a>

          <a
            class="profile__link profile__link--fanvue"
            href="https://www.fanvue.com/sophiecaviezel"
          >
            <span class="profile__link-heading">
              <img
                class="profile__link-icon"
                src="/images/icon-message.svg"
                alt=""
                aria-hidden="true"
              />
              <span class="profile__link-label">come a little closer</span>
            </span>
            <span class="profile__link-description">Fanvue · messages &amp; custom content</span>
          </a>
        </div>
      </div>

      <footer class="profile__footer">
        <nav aria-label="Social links">
          <a href="https://www.threads.com/@sophie_caviezel">Threads</a>
          <span aria-hidden="true">|</span>
          <a href="https://www.instagram.com/sophie_caviezel/">Instagram</a>
          <span aria-hidden="true">|</span>
          <a href="https://github.com/sophiecvz">GitHub</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
